<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="dev" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="status" data-role="status">connecting…</span></p>
    </header>
    <main data-testid="board">
      <div data-testid="loader" class="loader" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span> Loading incidents…
      </div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <p class="error" data-role="error" role="alert" hidden></p>
      <div class="layout">
        <ul data-testid="incident-list" class="list" aria-label="Incidents, newest first. Open one to ack it."></ul>
        <aside data-testid="incident-panel" class="panel" aria-live="polite" hidden></aside>
      </div>
    </main>
    <footer>sched-prod incident board · build <code data-testid="build-sha">dev</code></footer>
  </body>
</html>
